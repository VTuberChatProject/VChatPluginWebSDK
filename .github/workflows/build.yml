# 独立验证 Python/C++ 开发入口与协议生成。
name: Web SDK
on: [push, pull_request, workflow_dispatch]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: python -m pip install -r requirements.txt
      - run: python Tools/generate.py
      - run: python Tools/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: WebSDK-Python
          path: target/python/
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev libboost-system-dev
      - run: cmake -S Examples -B target/cpp
      - run: cmake --build target/cpp --parallel 4
